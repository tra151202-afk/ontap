<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn tập Hiragana hàng NA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Shippori+Mincho:wght@500;700&display=swap">
<style>
:root{--bg:#E8EEF0;--surface:#F7FAFA;--ink:#14213D;--muted:#53607A;--line:#C5D0D6;--accent:#2F6F5E;--accent-ink:#fff;--hi:#F2C94C;--bad:#B3402F;--good:#2F6F5E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1626;--surface:#18223A;--ink:#E8EEF7;--muted:#9AA8C4;--line:#2D3A5A;--accent:#6CC3A6;--accent-ink:#0F1626;--hi:#F2C94C;--bad:#F08A78;--good:#6CC3A6}}
:root[data-theme="dark"]{--bg:#0F1626;--surface:#18223A;--ink:#E8EEF7;--muted:#9AA8C4;--line:#2D3A5A;--accent:#6CC3A6;--accent-ink:#0F1626;--hi:#F2C94C;--bad:#F08A78;--good:#6CC3A6}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;line-height:1.55}
.jp{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:1.15rem;font-weight:600;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px;font-size:.95rem}
.hero{display:flex;gap:8px;margin-bottom:20px}
.hero button{flex:1;aspect-ratio:1/1.15;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;transition:background .15s,transform .15s}
.hero button .jp{font-size:clamp(2.6rem,12vw,4.6rem);line-height:1}
.hero button small{color:var(--muted);font-size:.85rem;margin-top:4px}
.hero button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hero button[aria-pressed="true"] small{color:var(--bg)}
.hero button:active{transform:scale(.97)}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
nav[role=tablist]{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px}
nav button{background:none;border:0;padding:10px 14px;font:inherit;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px}
.detail-top{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.big{font-size:6rem;line-height:1;margin:0}
.facts p{margin:2px 0;color:var(--muted)}
.facts strong{color:var(--ink)}
.words{list-style:none;margin:20px 0 0;padding:0;border-top:1px solid var(--line)}
.words li{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.words .w{font-size:1.5rem}
.words .r{color:var(--muted);margin-left:10px;font-size:.95rem}
.words .m{display:block;font-size:.95rem}
.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:6px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.icon{padding:6px 10px}
.fc{perspective:900px;margin-bottom:16px}
.fc-inner{position:relative;min-height:230px;cursor:pointer;transition:transform .35s;transform-style:preserve-3d;width:100%;border:0;background:none;padding:0;color:inherit;font:inherit}
.fc-inner.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center}
.face.back{transform:rotateY(180deg)}
.face .jp{font-size:3.6rem;line-height:1.1}
.face .hint{color:var(--muted);font-size:.9rem;margin-top:10px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:8px}
.q{font-size:1.1rem;margin:0 0 4px}
.qbig{font-size:3rem;line-height:1.2;margin:6px 0 16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{font:inherit;text-align:left;padding:12px 14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;cursor:pointer}
.opt.jp{font-size:1.4rem}
.opt.ok{background:var(--good);color:var(--accent-ink);border-color:var(--good)}
.opt.no{background:var(--bad);color:var(--bg);border-color:var(--bad)}
.score{font-size:2.4rem;font-weight:600;margin:0}
.fb{min-height:1.6em;margin:12px 0 0;color:var(--muted)}
@media (max-width:480px){.opts{grid-template-columns:1fr}.big{font-size:4.6rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<h1>Ôn tập Hiragana hàng NA</h1>
<p class="sub">Năm chữ な・に・ぬ・ね・の cùng 20 từ vựng thường gặp. Chọn một chữ để xem chi tiết, rồi luyện bằng thẻ ghi nhớ hoặc trắc nghiệm.</p>

<div class="hero" id="hero" role="group" aria-label="Chọn chữ cái"></div>

<nav role="tablist" id="tabs">
<button role="tab" aria-selected="true" data-t="learn">Bảng chữ</button>
<button role="tab" aria-selected="false" data-t="cards">Thẻ ghi nhớ</button>
<button role="tab" aria-selected="false" data-t="quiz">Trắc nghiệm</button>
</nav>

<section class="panel" id="learn"></section>
<section class="panel" id="cards" hidden></section>
<section class="panel" id="quiz" hidden></section>
</main>

<script>
var K=[
{k:'な',r:'na',s:4,n:'Bốn nét. Chữ な có vòng ở nét cuối; đừng nhầm với ね và ぬ (hai chữ này chỉ có hai nét).'},
{k:'に',r:'ni',s:3,n:'Ba nét: một nét dọc bên trái rồi hai nét ngang ngắn bên phải. Đây cũng là trợ từ chỉ địa điểm, thời điểm.'},
{k:'ぬ',r:'nu',s:2,n:'Hai nét, vòng cuộn vào trong ở cuối. Dễ lẫn với め, nên nhớ ぬ có thêm vòng nhỏ ở đuôi.'},
{k:'ね',r:'ne',s:2,n:'Hai nét, có nét dọc bên trái giống れ và わ; vòng ở cuối mở ra ngoài.'},
{k:'の',r:'no',s:1,n:'Một nét cong liền. Cũng là trợ từ sở hữu, giống “của” trong tiếng Việt.'}
];
var W=[
[0,'なつ','natsu','mùa hè'],[0,'なまえ','namae','tên'],[0,'なに','nani','cái gì'],[0,'なか','naka','bên trong'],
[1,'にく','niku','thịt'],[1,'にわ','niwa','khu vườn'],[1,'にほん','nihon','Nhật Bản'],[1,'にじ','niji','cầu vồng'],
[2,'いぬ','inu','con chó'],[2,'ぬの','nuno','vải'],[2,'ぬま','numa','đầm lầy'],[2,'ぬりえ','nurie','tranh tô màu'],
[3,'ねこ','neko','con mèo'],[3,'ねる','neru','ngủ'],[3,'ねぎ','negi','hành lá'],[3,'ねつ','netsu','sốt, nhiệt'],
[4,'のり','nori','rong biển'],[4,'のむ','nomu','uống'],[4,'のみもの','nomimono','đồ uống'],[4,'のぼる','noboru','leo, trèo']
].map(function(a){return {i:a[0],k:a[1],r:a[2],m:a[3]}});

function $(id){return document.getElementById(id)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function speak(t){try{var u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

/* hero + learn */
var cur=0;
function drawHero(){
  $('hero').innerHTML=K.map(function(c,i){return '<button class="" data-i="'+i+'" aria-pressed="'+(i===cur)+'" aria-label="'+c.k+' '+c.r+'"><span class="jp">'+c.k+'</span><small>'+c.r+'</small></button>'}).join('');
}
function drawLearn(){
  var c=K[cur];
  var ws=W.filter(function(w){return w.i===cur});
  $('learn').innerHTML='<div class="card"><div class="detail-top"><p class="big jp">'+c.k+'</p><div class="facts"><p><strong>Phiên âm:</strong> '+c.r+'</p><p><strong>Số nét:</strong> '+c.s+'</p><p>'+c.n+'</p><button class="btn" data-say="'+c.k+'">Nghe phát âm</button></div></div>'+
  '<ul class="words">'+ws.map(function(w){return '<li><div><span class="w jp">'+w.k+'</span><span class="r">'+w.r+'</span><span class="m">'+w.m+'</span></div><button class="btn icon" data-say="'+w.k+'" aria-label="Nghe '+w.k+'">Nghe</button></li>'}).join('')+'</ul></div>';
}
$('hero').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;cur=+b.dataset.i;drawHero();drawLearn();speak(K[cur].k)});
document.addEventListener('click',function(e){var b=e.target.closest('[data-say]');if(b)speak(b.dataset.say)});

/* tabs */
$('tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  [].forEach.call($('tabs').children,function(x){x.setAttribute('aria-selected',x===b)});
  ['learn','cards','quiz'].forEach(function(id){$(id).hidden=id!==b.dataset.t});
  if(b.dataset.t==='cards')startCards();
  if(b.dataset.t==='quiz')startQuiz();
});

/* flashcards */
var deck=[],total=0,done=0,flipped=false;
function startCards(){deck=shuffle(W);total=deck.length;done=0;flipped=false;drawCard()}
function drawCard(){
  var p=$('cards');
  if(!deck.length){p.innerHTML='<div class="card"><p class="score">Hoàn thành</p><p>Bạn đã nhớ cả '+total+' từ trong bộ thẻ này.</p><button class="btn primary" id="again">Học lại từ đầu</button></div>';$('again').onclick=startCards;return}
  var w=deck[0];
  p.innerHTML='<div class="meta"><span>Đã nhớ '+done+' / '+total+'</span><span>Còn '+deck.length+' thẻ</span></div><div class="bar"><i style="width:'+(done/total*100)+'%"></i></div>'+
  '<div class="fc"><button class="fc-inner'+(flipped?' flip':'')+'" id="fc" aria-label="Lật thẻ"><div class="face"><span class="jp">'+w.k+'</span><span class="hint">Chạm để lật thẻ</span></div><div class="face back"><span class="jp" style="font-size:2.2rem">'+w.r+'</span><span style="font-size:1.3rem;margin-top:6px">'+w.m+'</span></div></button></div>'+
  '<div class="row"><button class="btn" data-say="'+w.k+'">Nghe</button><button class="btn" id="no">Chưa nhớ</button><button class="btn primary" id="yes">Đã nhớ</button></div>';
  $('fc').onclick=function(){flipped=!flipped;this.classList.toggle('flip',flipped)};
  $('yes').onclick=function(){deck.shift();done++;flipped=false;drawCard()};
  $('no').onclick=function(){deck.push(deck.shift());flipped=false;drawCard()};
}

/* quiz */
var qs=[],qi=0,score=0,locked=false;
function pick(arr,n,not){var r=[];shuffle(arr).forEach(function(x){if(r.length<n&&x!==not&&r.indexOf(x)<0)r.push(x)});return r}
function mkQ(){
  var out=[];
  shuffle(W).slice(0,10).forEach(function(w,idx){
    var t=idx%3;
    if(t===0){ // kana -> romaji
      var ro=[w.r].concat(pick(W.map(function(x){return x.r}),3,w.r));
      out.push({p:'Từ này đọc là gì?',big:w.k,opts:shuffle(ro),ans:w.r,say:w.k});
    }else if(t===1){ // word -> meaning
      var ms=[w.m].concat(pick(W.map(function(x){return x.m}),3,w.m));
      out.push({p:'Từ này có nghĩa là gì?',big:w.k,opts:shuffle(ms),ans:w.m,say:w.k});
    }else{ // meaning -> word
      var ks=[w.k].concat(pick(W.map(function(x){return x.k}),3,w.k));
      out.push({p:'Chọn từ tiếng Nhật có nghĩa:',big:w.m,opts:shuffle(ks),ans:w.k,jp:true,small:true});
    }
  });
  return out;
}
function startQuiz(){qs=mkQ();qi=0;score=0;locked=false;drawQ()}
function drawQ(){
  var p=$('quiz');
  if(qi>=qs.length){
    var msg=score>=9?'Rất tốt, bạn nắm chắc hàng NA.':score>=6?'Khá ổn. Ôn thêm vài từ là vững.':'Hãy xem lại bảng chữ và thẻ ghi nhớ rồi thử lại.';
    p.innerHTML='<div class="card"><p class="score">'+score+' / '+qs.length+'</p><p>'+msg+'</p><button class="btn primary" id="again2">Làm bộ câu hỏi mới</button></div>';$('again2').onclick=startQuiz;return}
  var q=qs[qi];
  p.innerHTML='<div class="meta"><span>Câu '+(qi+1)+' / '+qs.length+'</span><span>Điểm: '+score+'</span></div><div class="bar"><i style="width:'+(qi/qs.length*100)+'%"></i></div>'+
  '<div class="card"><p class="q">'+q.p+'</p><p class="qbig'+(q.small?'':' jp')+'" style="'+(q.small?'font-size:2rem':'')+'">'+q.big+'</p><div class="opts">'+
  q.opts.map(function(o){return '<button class="opt'+(q.jp?' jp':'')+'" data-o="'+o+'">'+o+'</button>'}).join('')+'</div><p class="fb" id="fb" aria-live="polite"></p><button class="btn primary" id="next" hidden>Câu tiếp theo</button></div>';
  locked=false;
  [].forEach.call(p.querySelectorAll('.opt'),function(b){b.onclick=function(){
    if(locked)return;locked=true;
    var ok=b.dataset.o===q.ans;if(ok)score++;
    [].forEach.call(p.querySelectorAll('.opt'),function(x){if(x.dataset.o===q.ans)x.classList.add('ok')});
    if(!ok)b.classList.add('no');
    $('fb').textContent=ok?'Chính xác.':'Chưa đúng. Đáp án là “'+q.ans+'”.';
    if(q.say)speak(q.say);
    $('next').hidden=false;$('next').focus();
    $('next').onclick=function(){qi++;drawQ()};
  }});
}

drawHero();drawLearn();
</script>
</body>
</html>
